    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nouran_theme');
          var theme = raw ? (raw === 'dark' || raw === 'light' ? raw : JSON.parse(raw)) : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fcfaf7] dark:bg-[#0c1411] text-[#1e293b] dark:text-[#e2e8f0] font-sans antialiased selection:bg-emerald-600 selection:text-white transition-colors duration-200">
